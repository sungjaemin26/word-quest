<script>
 
function spellingDistance(a, b) {
  a = String(a ?? "").trim().toLowerCase();
  b = String(b ?? "").trim().toLowerCase();

  const dp = Array.from(
    { length: a.length + 1 },
    () => Array(b.length + 1).fill(0)
  );

  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] +
          (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }

  return dp[a.length][b.length];
}

function getResultClass(userAnswer, correctAnswer, isCorrect, skipped, mode) {
  if (isCorrect) return "result-correct";
  if (skipped) return "result-wrong";

  // 영어 철자 입력 문제에서만 한 글자 차이 판정
  if (mode === "spell" &&
      spellingDistance(userAnswer, correctAnswer) === 1) {
    return "result-almost";
  }

  return "result-wrong";
}

"use strict";

const $ = id => document.getElementById(id);
const KEY = "wordQuestMultiBooksV1";
const OLD = "wordQuestTextV1";

const defaults = [
["various","다양한","a"],
["significant","중요한, 상당한","a"],
["contribute","기여하다","v"],
["accurate","정확한","a"],
["maintain","유지하다","v"],
["reluctant","꺼리는","a"],
["interpret","해석하다","v"],
["efficient","효율적인","a"],
["consequence","결과, 영향","n"],
["emerge","나타나다","v"],
["perspective","관점","n"],
["relevant","관련 있는","a"],
["potential","잠재적인","a"],
["alter","변경하다","v"],
["establish","확립하다","v"],
["scarce","부족한","a"],
["justify","정당화하다","v"],
["consume","소비하다","v"],
["evaluate","평가하다","v"],
["indicate","나타내다","v"]
].map(([en,ko,pos])=>({en,ko,pos}));

const norm = s => String(s||"").trim().replace(/\s+/g," ");
const key = s => norm(s).toLowerCase();

function load(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  if(data && Array.isArray(data.books) && data.books.length){
   return data;
  }
 }catch(e){}

 let old;
 try{
  old=JSON.parse(localStorage.getItem(OLD));
 }catch(e){}

 return {
  books:[{
   id:"default",
   name:"기본 단어장",
   words:Array.isArray(old)?old:defaults
  }]
 };
}

let db=load();
let preview=[];
let editing=-1;
let mode="meaning";
let deck=[];
let qi=0;
let score=0;
let streak=0;
let answered=false;
let history=[];

function persist(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
 }catch(e){
  alert("브라우저 저장에 실패했습니다.");
  return false;
 }
}

function book(id){
 return db.books.find(b=>b.id===id);
}

function posLabel(p){
 return {
  n:"n · 명사",
  v:"v · 동사",
  a:"a · 형용사",
  ad:"ad · 부사"
 }[p] || "미확인 / 숙어";
}

function shuffled(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function showPage(name){
 for(const p of ["game","books","import"]){
  $(p+"Page").classList.toggle("hidden",p!==name);
 }
 document.querySelectorAll("[data-page]").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===name);
 });
 if(name==="books") renderBook();
}

document.querySelectorAll("[data-page]").forEach(b=>{
 b.onclick=()=>showPage(b.dataset.page);
});

function refreshSelectors(){
 for(const id of ["gameBook","manageBook","importBook"]){
  const select=$(id);
  const previous=select.value;
  select.replaceChildren();

  for(const b of db.books){
   const option=document.createElement("option");
   option.value=b.id;
   option.textContent=b.name+" ("+b.words.length+"개)";
   select.append(option);
  }

  if(book(previous)) select.value=previous;
 }
}

function makeBook(name){
 name=norm(name);

 if(!name){
  alert("단어장 이름을 입력하세요.");
  return null;
 }

 if(db.books.some(b=>b.name===name)){
  alert("같은 이름의 단어장이 있습니다.");
  return null;
 }

 const b={
  id:"book_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
  name,
  words:[]
 };

 db.books.push(b);
 persist();
 refreshSelectors();
 return b;
}

$("createBook").onclick=()=>{
 const b=makeBook($("newBookName").value);
 if(!b)return;
 $("newBookName").value="";
 $("manageBook").value=b.id;
 renderBook();
};

$("importCreate").onclick=()=>{
 const b=makeBook($("importNewName").value);
 if(!b)return;
 $("importNewName").value="";
 $("importBook").value=b.id;
};

$("renameBook").onclick=()=>{
 const b=book($("manageBook").value);
 if(!b)return;

 let name=prompt("새 단어장 이름",b.name);
 if(name===null)return;
 name=norm(name);

 if(!name || db.books.some(x=>x.id!==b.id && x.name===name)){
  alert("사용할 수 없는 이름입니다.");
  return;
 }

 b.name=name;
 persist();
 refreshSelectors();
 renderBook();
};

$("deleteBook").onclick=()=>{
 const b=book($("manageBook").value);
 if(!b)return;

 if(db.books.length===1){
  alert("마지막 단어장은 삭제할 수 없습니다.");
  return;
 }

 if(!confirm(b.name+" 단어장과 모든 단어를 삭제할까요?"))return;

 db.books=db.books.filter(x=>x.id!==b.id);
 persist();
 refreshSelectors();
 renderBook();
};

function clearEditor(){
 editing=-1;
 $("editEn").value="";
 $("editKo").value="";
 $("editPos").value="";
 $("saveWord").textContent="단어 저장";
}

$("cancelEdit").onclick=clearEditor;

$("manageBook").onchange=()=>{
 clearEditor();
 renderBook();
};

function valid(w){
 return /^[a-z][a-z\s'’\-]*$/i.test(norm(w.en))
  && /[가-힣]/.test(w.ko);
}

$("saveWord").onclick=()=>{
 const b=book($("manageBook").value);
 if(!b)return;

 const w={
  en:norm($("editEn").value),
  ko:norm($("editKo").value),
  pos:$("editPos").value
 };

 if(!valid(w)){
  alert("영어 표현과 한국어 뜻을 확인하세요.");
  return;
 }

 const duplicate=b.words.findIndex((x,i)=>
  key(x.en)===key(w.en) && i!==editing
 );

 if(duplicate>=0){
  alert("이미 등록된 표현입니다.");
  return;
 }

 if(editing>=0)b.words[editing]=w;
 else b.words.push(w);

 persist();
 clearEditor();
 refreshSelectors();
 renderBook();
};

function renderBook(){
 const b=book($("manageBook").value);
 if(!b)return;

 $("bookCount").textContent=b.name+" · "+b.words.length+"개";

 const query=key($("search").value);
 const list=$("wordList");
 list.replaceChildren();

 b.words.forEach((w,i)=>{
  if(!key(w.en).includes(query) && !key(w.ko).includes(query))return;

  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("strong");
  title.textContent=w.en+" — "+w.ko;

  const pos=document.createElement("p");
  pos.className="muted";
  pos.textContent=posLabel(w.pos);

  const row=document.createElement("div");
  row.className="row";

  const edit=document.createElement("button");
  edit.className="secondary small";
  edit.textContent="수정";
  edit.onclick=()=>{
   editing=i;
   $("editEn").value=w.en;
   $("editKo").value=w.ko;
   $("editPos").value=w.pos||"";
   $("saveWord").textContent="수정 저장";
   $("editEn").scrollIntoView({behavior:"smooth"});
  };

  const del=document.createElement("button");
  del.className="danger small";
  del.textContent="삭제";
  del.onclick=()=>{
   if(!confirm(w.en+" 삭제할까요?"))return;
   b.words.splice(i,1);
   persist();
   refreshSelectors();
   renderBook();
  };

  row.append(edit,del);
  card.append(title,pos,row);
  list.append(card);
 });
}

$("search").oninput=renderBook;

$("export").onclick=async()=>{
 const b=book($("manageBook").value);
 if(!b)return;

 const text=b.words.map(w=>
  w.en+" | "+w.ko+" | "+(w.pos||"")
 ).join("\n");

 try{
  await navigator.clipboard.writeText(text);
  alert("단어장을 복사했습니다.");
 }catch(e){
  prompt("아래 내용을 복사하세요.",text);
 }
};

// ==============================
// 텍스트 자동 분리
// ==============================

// 한국어 뜻은 영어 표현이 시작되는 지점까지 읽는다.
// 숙어 안의 영어 공백은 그대로 유지한다.

const ENG="[A-Za-z][A-Za-z’'\\-]*(?:\\s+[A-Za-z][A-Za-z’'\\-]*)*";
const KOR="[~～]?[가-힣][가-힣0-9\\s,·()~～\\-]*";

function parseText(raw){
 const found=[];
 const failed=[];
 const seen=new Set();

 const lines=raw.replace(/\r/g,"").split("\n");

 for(let line of lines){
  line=line.trim().replace(/^\s*(?:\d+[.)]|[•*])\s*/,"");
  if(!line)continue;

  // | 또는 탭으로 구분된 단어
  const explicit=line.match(
   /^(.+?)\s*[|\t]\s*(.+?)(?:\s*[|\t]\s*(n|v|a|ad))?\s*$/i
  );

  if(explicit){
   const w={
    en:norm(explicit[1]),
    ko:norm(explicit[2]),
    pos:(explicit[3]||"").toLowerCase()
   };

   if(valid(w) && !seen.has(key(w.en))){
    found.push(w);
    seen.add(key(w.en));
   }else{
    failed.push(line);
   }
   continue;
  }

  const re=new RegExp(
   "("+ENG+")\\s+("+KOR+")(?=\\s+(?:"+ENG+")\\s+[~～가-힣]|$)",
   "g"
  );

  const matches=[...line.matchAll(re)];

  if(!matches.length){
   failed.push(line);
   continue;
  }

  for(const m of matches){
   const w={
    en:norm(m[1]),
    ko:norm(m[2]),
    pos:""
   };

   if(valid(w) && !seen.has(key(w.en))){
    found.push(w);
    seen.add(key(w.en));
   }
  }
 }

 return {found,failed};
}

function textField(label,value,callback){
 const box=document.createElement("label");
 box.textContent=label;

 const input=document.createElement("input");
 input.value=value;
 input.oninput=()=>callback(input.value);

 box.append(input);
 return box;
}

function posField(value,callback){
 const select=document.createElement("select");

 for(const [v,t] of [
  ["","미확인 / 숙어"],
  ["n","n 명사"],
  ["v","v 동사"],
  ["a","a 형용사"],
  ["ad","ad 부사"]
 ]){
  const option=document.createElement("option");
  option.value=v;
  option.textContent=t;
  select.append(option);
 }

 select.value=value||"";
 select.onchange=()=>callback(select.value);
 return select;
}

function renderPreview(){
 const list=$("previewList");
 list.replaceChildren();

 $("previewHeading").textContent="분리된 표현 "+preview.length+"개";

 preview.forEach((w,i)=>{
  const card=document.createElement("div");
  card.className="card";

  const grid=document.createElement("div");
  grid.className="two";

  grid.append(
   textField("영어",w.en,v=>w.en=v),
   textField("한국어 뜻",w.ko,v=>w.ko=v)
  );

  const label=document.createElement("label");
  label.textContent="품사";
  label.append(posField(w.pos,v=>w.pos=v));

  const del=document.createElement("button");
  del.className="danger small";
  del.textContent="제외";
  del.onclick=()=>{
   preview.splice(i,1);
   renderPreview();
  };

  card.append(grid,label,del);
  list.append(card);
 });
}

$("analyze").onclick=()=>{
 const result=parseText($("rawText").value);
 preview=result.found;

 $("preview").classList.toggle("hidden",!preview.length);

 const info=$("analysisInfo");
 info.classList.remove("hidden");
 info.replaceChildren();

 const message=document.createElement("div");
 message.textContent=
  "분석 결과: "+preview.length+"개 인식 · "+
  result.failed.length+"줄 확인 필요";

 info.append(message);

 if(result.failed.length){
  const details=document.createElement("details");
  const summary=document.createElement("summary");
  const pre=document.createElement("pre");

  summary.textContent="인식하지 못한 줄 보기";
  pre.style.whiteSpace="pre-wrap";
  pre.textContent=result.failed.join("\n");

  details.append(summary,pre);
  info.append(details);
 }

 renderPreview();
};

$("saveImport").onclick=()=>{
 const b=book($("importBook").value);
 if(!b)return;

 let added=0;
 let updated=0;
 let invalid=0;

 for(const raw of preview){
  const w={
   en:norm(raw.en),
   ko:norm(raw.ko),
   pos:raw.pos||""
  };

  if(!valid(w)){
   invalid++;
   continue;
  }

  const index=b.words.findIndex(x=>key(x.en)===key(w.en));

  if(index>=0){
   b.words[index]=w;
   updated++;
  }else{
   b.words.push(w);
   added++;
  }
 }

 persist();
 refreshSelectors();

 alert(
  b.name+"\n"+
  "새 단어 "+added+"개\n"+
  "기존 단어 갱신 "+updated+"개\n"+
  "제외 "+invalid+"개"
 );

 preview=[];
 $("preview").classList.add("hidden");
 $("analysisInfo").classList.add("hidden");
 $("rawText").value="";
 $("manageBook").value=b.id;

 showPage("books");
};

// ==============================
// 게임
// ==============================

function updateStats(){
 $("score").textContent=score;
 $("streak").textContent=streak;
 $("progress").textContent=
  Math.min(qi+(answered?1:0),deck.length)+"/"+deck.length;
}

function startGame(){
 const b=book($("gameBook").value);
 if(!b)return;

 deck=shuffled(b.words).slice(0,20).map(w=>({...w}));
 qi=0;
 score=0;
 streak=0;
 history=[];
 answered=false;

 $("results").classList.add("hidden");
 $("play").classList.toggle("hidden",!deck.length);
 $("gameMessage").classList.toggle("hidden",!!deck.length);

 if(!deck.length){
  $("gameMessage").textContent=
   "이 단어장은 비어 있습니다. 먼저 단어를 추가하세요.";
  updateStats();
  return;
 }

 renderQuestion();
}

function renderQuestion(){
 if(qi>=deck.length){
  showResults();
  return;
 }

 answered=false;
 const w=deck[qi];

 $("question").textContent=mode==="meaning"?w.ko:w.en;
 $("questionLabel").textContent=mode==="meaning"?
  "뜻을 보고 영어 표현을 입력하세요":
  "영어 표현의 뜻을 선택하세요";

 $("questionPos").textContent=posLabel(w.pos);
 $("typing").classList.toggle("hidden",mode!=="meaning");
 $("options").classList.toggle("hidden",mode==="meaning");

 $("answer").value="";
 $("answer").disabled=false;
 $("check").disabled=false;
 $("feedback").className="note hidden";
 $("next").classList.add("hidden");
 $("skip").classList.remove("hidden");

 if(mode==="english"){
  const options=$("options");
  options.replaceChildren();

  const choices=[w];
  const used=new Set([key(w.ko)]);

  for(const x of shuffled(book($("gameBook").value).words)){
   if(key(x.en)===key(w.en)||used.has(key(x.ko)))continue;
   choices.push(x);
   used.add(key(x.ko));
   if(choices.length===4)break;
  }

  for(const x of shuffled(choices)){
   const button=document.createElement("button");
   button.className="option";
   button.textContent=x.ko;
   button.onclick=()=>finish(
    key(x.en)===key(w.en),x.en,false
   );
   options.append(button);
  }
 }

 updateStats();
}

function finish(correct,answer,skipped){
 if(answered)return;
 answered=true;

 const w=deck[qi];
 const status=skipped?"skip":correct?"correct":"wrong";

 history.push({
  word:{...w},
  answer,
  status,
  mode
 });

 if(correct&&!skipped){
  score+=10;
  streak++;
 }else{
  streak=0;
 }

 $("answer").disabled=true;
 $("check").disabled=true;

 const feedback=$("feedback");
 feedback.className="note "+(correct?"ok":"bad");

 const lines=[
  skipped?"건너뛴 문제입니다.":
  correct?"정답! +10점":"오답입니다."
 ];

 if(!correct){
  lines.push("내 답: "+(skipped?"건너뜀":answer));

  const mine=book($("gameBook").value).words.find(
   x=>key(x.en)===key(answer)
  );

  if(mine&&mode==="meaning"){
   lines.push("내 답의 뜻: "+mine.ko);
  }
 }

 lines.push(
  "정답: "+w.en,
  "뜻: "+w.ko,
  "품사: "+posLabel(w.pos)
 );

 feedback.textContent=lines.join("\n");

 if(mode==="english"){
  [...$("options").children].forEach(button=>{
   button.disabled=true;

   if(button.textContent===w.ko){
    button.classList.add("correct");
   }else if(!correct&&!skipped){
    const mine=book($("gameBook").value).words.find(
     x=>key(x.en)===key(answer)
    );
    if(mine&&button.textContent===mine.ko){
     button.classList.add("wrong");
    }
   }
  });
 }

 $("skip").classList.add("hidden");
 $("next").classList.remove("hidden");
 $("next").textContent=
  qi===deck.length-1?"결과 확인":"다음 문제";

 updateStats();
}

$("check").onclick=()=>{
 const answer=key($("answer").value);
 if(!answer){
  alert("답을 입력하세요.");
  return;
 }

 finish(answer===key(deck[qi].en),answer,false);
};

$("answer").onkeydown=e=>{
 if(e.key==="Enter"&&!answered&&mode==="meaning"){
  $("check").click();
 }
};

$("skip").onclick=()=>finish(false,"",true);

$("next").onclick=()=>{
 qi++;
 renderQuestion();
};

function showResults(){
 $("play").classList.add("hidden");
 $("results").classList.remove("hidden");

 const correct=history.filter(x=>x.status==="correct").length;
 const wrong=history.filter(x=>x.status==="wrong").length;
 const skipped=history.filter(x=>x.status==="skip").length;

 $("summary").textContent=
  "총 "+history.length+"문제\n"+
  "정답 "+correct+"개 · 오답 "+wrong+"개 · 건너뜀 "+skipped+"개\n"+
  "최종 점수: "+score+"점";

 const list=$("resultList");
 list.replaceChildren();

 history.forEach((r,i)=>{
  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("strong");
  title.textContent=(i+1)+". "+({
   correct:"정답",
   wrong:"오답",
   skip:"건너뜀"
  }[r.status]);

  const p=document.createElement("p");
  p.textContent=
   r.word.en+" ("+posLabel(r.word.pos)+") — "+r.word.ko;

  card.append(title,p);

  if(r.status!=="correct"){
   const answer=document.createElement("p");
   answer.textContent=
    "내 답: "+(r.status==="skip"?"건너뜀":r.answer);
   card.append(answer);

   if(r.mode==="meaning"){
    const mine=book($("gameBook").value)?.words.find(
     w=>key(w.en)===key(r.answer)
    );

    if(mine){
     const explanation=document.createElement("p");
     explanation.textContent="내 답의 뜻: "+mine.ko;
     card.append(explanation);
    }
   }
  }

  list.append(card);
 });

 updateStats();
}

$("modeMeaning").onclick=()=>{
 mode="meaning";
 $("modeMeaning").className="primary grow";
 $("modeEnglish").className="secondary grow";
 startGame();
};

$("modeEnglish").onclick=()=>{
 mode="english";
 $("modeEnglish").className="primary grow";
 $("modeMeaning").className="secondary grow";
 startGame();
};

$("gameBook").onchange=startGame;
$("startGame").onclick=startGame;
$("retry").onclick=startGame;

refreshSelectors();
persist();
startGame();
</script>
</body>
</html>
