
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORD QUEST</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#f1f5f9;
 color:#1e293b;
 font-family:Arial,"Apple SD Gothic Neo",sans-serif;
}
main{
 max-width:720px;margin:auto;padding:20px;
 background:white;border-radius:18px;
}
h1{text-align:center;color:#2563eb;margin-bottom:5px}
h2{font-size:21px}
h3{font-size:17px}
.muted{color:#64748b;font-size:13px;line-height:1.6}
.tabs,.row{
 display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;
}
button{
 border:0;border-radius:9px;padding:12px;
 font-size:14px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.55;cursor:default}
.tab,.secondary{background:#e2e8f0;color:#334155}
.tab{flex:1}
.primary,.active{
 background:#2563eb!important;color:white!important;
}
.danger{background:#fee2e2;color:#991b1b}
.full{width:100%;margin:7px 0}
.hidden{display:none!important}
input,select,textarea{
 width:100%;padding:12px;
 border:1px solid #cbd5e1;border-radius:9px;
 font-size:16px;background:white;color:#1e293b;
}
textarea{min-height:180px;line-height:1.6}
label{display:block;margin:12px 0 5px}
.card{
 border:1px solid #dbe3ee;border-radius:12px;
 padding:13px;margin:10px 0;overflow-wrap:anywhere;
}
.note{
 padding:13px;background:#eff6ff;border-radius:10px;
 white-space:pre-wrap;margin:12px 0;line-height:1.6;
}
.ok{background:#dcfce7;color:#166534}
.bad{background:#fee2e2;color:#991b1b}
.stats{
 display:flex;justify-content:space-around;
 background:#eff6ff;padding:14px;border-radius:12px;
 margin:12px 0;
}
.stats div{text-align:center;font-size:12px}
.stats strong{
 display:block;color:#1d4ed8;font-size:23px;
}
.question{
 text-align:center;background:#f8fafc;
 padding:24px 10px;border-radius:12px;
 margin:16px 0;overflow-wrap:anywhere;
}
.options{
 display:grid;grid-template-columns:1fr 1fr;gap:9px;
}
.option{
 background:#f1f5f9;min-height:60px;
 overflow-wrap:anywhere;
}
.option.correct{background:#dcfce7;color:#166534}
.option.wrong{background:#fee2e2;color:#991b1b}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grow{flex:1}
.small{font-size:12px;padding:8px}
hr{
 border:0;border-top:1px solid #e2e8f0;margin:20px 0;
}
.result-correct{
 background:#dcfce7;border:2px solid #22c55e;
 color:#166534;
}
.result-almost{
 background:#ffedd5;border:2px solid #f97316;
 color:#9a3412;
}
.result-wrong{
 background:#fee2e2;border:2px solid #ef4444;
 color:#991b1b;
}
.result-status{font-weight:bold;margin-bottom:8px}
.result-detail{
 font-size:14px;line-height:1.6;margin:6px 0;
}
.tag{
 display:inline-block;padding:5px 9px;
 border-radius:20px;background:#e2e8f0;
 font-size:12px;
}
.reset-info{
 background:#f0fdf4;
 color:#166534;
 padding:12px;border-radius:10px;
 font-size:13px;line-height:1.6;
}
@media(max-width:450px){
 main{padding:14px}
 .two{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main>
<h1>WORD QUEST</h1>
<p class="muted" style="text-align:center">
나만의 단어장 · 20문제 게임 · 매일 오답 복습
</p>

<div class="tabs">
<button class="tab active" data-page="game">게임</button>
<button class="tab" data-page="books">단어장</button>
<button class="tab" data-page="import">텍스트 추가</button>
</div>

<section id="gamePage">
<label>공부할 단어장</label>
<select id="gameBook"></select>

<label>퀴즈 세트</label>
<div class="row">
<button class="primary grow" id="normalQuiz">
일반 퀴즈
</button>
<button class="secondary grow" id="wrongQuiz">
오답 모음집
</button>
</div>

<div id="quizInfo" class="note"></div>

<label>문제 유형</label>
<div class="row">
<button class="primary grow" id="modeMeaning">
뜻 → 영어
</button>
<button class="secondary grow" id="modeEnglish">
영어 → 뜻
</button>
</div>

<button class="secondary full" id="startGame">
새 퀴즈 시작
</button>

<div class="stats">
<div><strong id="score">0</strong>점수</div>
<div><strong id="streak">0</strong>연속 정답</div>
<div><strong id="progress">0/0</strong>진행</div>
</div>

<div id="gameMessage" class="note hidden"></div>

<div id="play" class="hidden">
<div class="question">
<div class="muted" id="questionLabel"></div>
<h2 id="question"></h2>
<div class="muted" id="questionPos"></div>
</div>

<div id="typing">
<input
 id="answer"
 placeholder="영어 단어 또는 숙어"
 autocomplete="off"
 autocapitalize="off"
>
<button class="primary full" id="check">
정답 확인
</button>
</div>

<div id="options" class="options hidden"></div>
<div id="feedback" class="note hidden"></div>
<button class="primary full hidden" id="next">
다음 문제
</button>
<button class="secondary full" id="skip">
건너뛰기
</button>
</div>

<div id="results" class="hidden">
<h2>학습 결과</h2>
<div id="summary" class="note"></div>
<div id="resultList"></div>
<button class="primary full" id="retry">
다시 공부하기
</button>
</div>

<hr>

<h3>오답 모음집 관리</h3>
<div id="wrongCount" class="note"></div>

<div class="reset-info">
오답은 매일 자정 이후 첫 접속 시 자동으로
복습 목록에 다시 추가됩니다.
정답을 맞힌 단어도 오답 이력에는 남습니다.
</div>

<div class="row">
<button class="secondary grow" id="restoreWrong">
오답 다시 풀기
</button>
<button class="danger grow" id="clearWrongHistory">
오답 이력 전체 삭제
</button>
</div>

<div id="wrongList"></div>
</section>

<section id="booksPage" class="hidden">
<h2>단어장 관리</h2>
<div class="row">
<input
 id="newBookName"
 class="grow"
 style="width:55%"
 placeholder="새 단어장 이름"
>
<button class="primary" id="createBook">
만들기
</button>
</div>

<label>관리할 단어장</label>
<select id="manageBook"></select>

<div class="row">
<button class="secondary grow" id="renameBook">
이름 변경
</button>
<button class="danger grow" id="deleteBook">
단어장 삭제
</button>
</div>

<div class="note" id="bookCount"></div>

<h3>단어 직접 추가 / 수정</h3>
<div class="two">
<label>영어
<input id="editEn" placeholder="in light of">
</label>
<label>뜻
<input id="editKo" placeholder="~을 고려하여">
</label>
</div>

<label>품사</label>
<select id="editPos">
<option value="">미확인 / 숙어</option>
<option value="n">n · 명사</option>
<option value="v">v · 동사</option>
<option value="a">a · 형용사</option>
<option value="ad">ad · 부사</option>
</select>

<div class="row">
<button class="primary grow" id="saveWord">
단어 저장
</button>
<button class="secondary grow" id="cancelEdit">
취소
</button>
</div>

<hr>
<input id="search" placeholder="단어 또는 뜻 검색">
<div id="wordList"></div>

<button class="secondary full" id="export">
현재 단어장 텍스트 복사
</button>
</section>

<section id="importPage" class="hidden">
<h2>텍스트 한꺼번에 추가</h2>
<p class="muted">
영어 | 뜻 형식을 권장합니다.
한 줄에 여러 단어를 넣어도 자동 분리를 시도합니다.
</p>

<label>저장할 단어장</label>
<select id="importBook"></select>

<div class="row">
<input
 id="importNewName"
 class="grow"
 style="width:55%"
 placeholder="새 단어장 이름"
>
<button class="secondary" id="importCreate">
새로 만들기
</button>
</div>

<textarea id="rawText" placeholder="proof | 증거
grieve | 슬퍼하다
relief | 안도
in light of | ~을 고려하여

또는
proof 증거 grieve 슬퍼하다 relief 안도"></textarea>

<button class="primary full" id="analyze">
자동 분리하기
</button>

<div class="note muted">
분석된 단어는 저장 전에 직접 수정할 수 있습니다.
</div>

<div id="analysisInfo" class="note hidden"></div>

<div id="preview" class="hidden">
<h3 id="previewHeading"></h3>
<div id="previewList"></div>
<button class="primary full" id="saveImport">
확인한 단어 모두 저장
</button>
</div>
</section>

<p class="muted" style="text-align:center">
단어장과 학습 기록은 현재 브라우저에 저장됩니다.
</p>
</main>

<script>
"use strict";

/* ==========================
   기본 설정
========================== */

const $=id=>document.getElementById(id);

const KEY="wordQuestMultiBooksV1";
const OLD="wordQuestTextV1";
const WRONG_KEY="wordQuestWrongAnswersV1";
const MASTERED_KEY="wordQuestMasteredV1";

const HISTORY_KEY="wordQuestWrongHistoryV2";
const RESET_KEY="wordQuestDailyResetV2";

const defaults=[
["various","다양한","a"],
["significant","중요한, 상당한","a"],
["contribute","기여하다","v"],
["accurate","정확한","a"],
["maintain","유지하다","v"],
["reluctant","꺼리는","a"],
["interpret","해석하다","v"],
["efficient","효율적인","a"],
["consequence","결과, 영향","n"],
["emerge","나타나다","v"],
["perspective","관점","n"],
["relevant","관련 있는","a"],
["potential","잠재적인","a"],
["alter","변경하다","v"],
["establish","확립하다","v"],
["scarce","부족한","a"],
["justify","정당화하다","v"],
["consume","소비하다","v"],
["evaluate","평가하다","v"],
["indicate","나타내다","v"]
].map(([en,ko,pos])=>({en,ko,pos}));

const norm=s=>
 String(s??"").trim().replace(/\s+/g," ");

const key=s=>norm(s).toLowerCase();

function loadJSON(storageKey,fallback){
 try{
  const raw=localStorage.getItem(storageKey);
  return raw===null?fallback:JSON.parse(raw);
 }catch(e){
  return fallback;
 }
}

function loadBooks(){
 const saved=loadJSON(KEY,null);

 if(
  saved &&
  Array.isArray(saved.books) &&
  saved.books.length
 ){
  return saved;
 }

 const old=loadJSON(OLD,null);

 return {
  books:[{
   id:"default",
   name:"기본 단어장",
   words:Array.isArray(old)?old:defaults
  }]
 };
}

function safeObject(value){
 return value &&
  typeof value==="object" &&
  !Array.isArray(value)
  ?value:{};
}

let db=loadBooks();

let wrongData=safeObject(
 loadJSON(WRONG_KEY,{})
);

let masteredData=safeObject(
 loadJSON(MASTERED_KEY,{})
);

let wrongHistory=safeObject(
 loadJSON(HISTORY_KEY,{})
);

let resetDates=safeObject(
 loadJSON(RESET_KEY,{})
);

let preview=[];
let editing=-1;
let mode="meaning";
let quizType="normal";

let deck=[];
let qi=0;
let score=0;
let streak=0;
let answered=false;
let history=[];

let activeBookId="";
let activeQuizType="normal";
let activeMode="meaning";

function persist(){
 try{
  localStorage.setItem(
   KEY,JSON.stringify(db)
  );
  localStorage.setItem(
   WRONG_KEY,JSON.stringify(wrongData)
  );
  localStorage.setItem(
   MASTERED_KEY,JSON.stringify(masteredData)
  );
  localStorage.setItem(
   HISTORY_KEY,JSON.stringify(wrongHistory)
  );
  localStorage.setItem(
   RESET_KEY,JSON.stringify(resetDates)
  );
  return true;
 }catch(e){
  alert("브라우저 저장에 실패했습니다.");
  return false;
 }
}

function book(id){
 return db.books.find(b=>b.id===id);
}

function posLabel(p){
 return {
  n:"n · 명사",
  v:"v · 동사",
  a:"a · 형용사",
  ad:"ad · 부사"
 }[p]||"미확인 / 숙어";
}

function shuffled(arr){
 const a=[...arr];

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(
   Math.random()*(i+1)
  );
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}

/* ==========================
   오답 기록 관리
========================== */

function getWrongSet(bookId){
 if(!Array.isArray(wrongData[bookId])){
  wrongData[bookId]=[];
 }
 return wrongData[bookId];
}

function getMasteredSet(bookId){
 if(!Array.isArray(masteredData[bookId])){
  masteredData[bookId]=[];
 }
 return masteredData[bookId];
}

function getWrongHistory(bookId){
 if(!Array.isArray(wrongHistory[bookId])){
  wrongHistory[bookId]=[];
 }
 return wrongHistory[bookId];
}

function uniqueWords(arr){
 const seen=new Set();

 return arr.filter(en=>{
  const k=key(en);
  if(!k||seen.has(k))return false;
  seen.add(k);
  return true;
 });
}

function addWrong(bookId,en){
 const current=getWrongSet(bookId);
 const all=getWrongHistory(bookId);

 wrongData[bookId]=uniqueWords([
  ...current,en
 ]);

 wrongHistory[bookId]=uniqueWords([
  ...all,en
 ]);

 masteredData[bookId]=
  getMasteredSet(bookId).filter(
   x=>key(x)!==key(en)
  );

 persist();
}

function removeWrong(bookId,en){
 wrongData[bookId]=
  getWrongSet(bookId).filter(
   x=>key(x)!==key(en)
  );

 persist();
}

function markMastered(bookId,en){
 const current=getMasteredSet(bookId);

 masteredData[bookId]=uniqueWords([
  ...current,en
 ]);

 persist();
}

function cleanRecords(bookId){
 const b=book(bookId);
 if(!b)return;

 const validKeys=new Set(
  b.words.map(w=>key(w.en))
 );

 wrongData[bookId]=uniqueWords(
  getWrongSet(bookId).filter(
   en=>validKeys.has(key(en))
  )
 );

 wrongHistory[bookId]=uniqueWords(
  getWrongHistory(bookId).filter(
   en=>validKeys.has(key(en))
  )
 );

 masteredData[bookId]=uniqueWords(
  getMasteredSet(bookId).filter(
   en=>validKeys.has(key(en))
  )
 );
}

/* 현지 날짜를 YYYY-MM-DD로 변환 */

function todayString(){
 const d=new Date();

 const year=d.getFullYear();
 const month=String(
  d.getMonth()+1
 ).padStart(2,"0");

 const day=String(
  d.getDate()
 ).padStart(2,"0");

 return year+"-"+month+"-"+day;
}

/* 이전 버전의 오답을 이력으로 옮기기 */

function migrateWrongHistory(){
 for(const b of db.books){
  cleanRecords(b.id);

  const oldWrong=getWrongSet(b.id);
  const all=getWrongHistory(b.id);

  wrongHistory[b.id]=uniqueWords([
   ...all,...oldWrong
  ]);
 }

 persist();
}

/* 수동 오답 복원 */

function restoreWrongAnswers(bookId){
 const b=book(bookId);
 if(!b)return 0;

 cleanRecords(bookId);

 const all=getWrongHistory(bookId);
 const validKeys=new Set(
  b.words.map(w=>key(w.en))
 );

 wrongData[bookId]=uniqueWords(
  all.filter(en=>validKeys.has(key(en)))
 );

 persist();

 return wrongData[bookId].length;
}

/* 하루 주기 자동 리셋 */

function dailyReset(bookId){
 const b=book(bookId);
 if(!b)return false;

 const today=todayString();
 const previous=resetDates[bookId];

 if(previous===today)return false;

 // 첫 실행 시 기존 오답은 보존한다.
 if(previous===undefined){
  resetDates[bookId]=today;
  persist();
  return false;
 }

 // 날짜가 앞으로 넘어갔을 때만 복원한다.
 if(previous<today){
  restoreWrongAnswers(bookId);
  resetDates[bookId]=today;
  persist();
  return true;
 }

 return false;
}

function checkAllDailyResets(){
 let changed=false;

 for(const b of db.books){
  if(dailyReset(b.id)){
   changed=true;
  }
 }

 if(changed){
  updateQuizInfo();
  renderWrongList();
 }
}

/* 수동 리셋 버튼 */

$("restoreWrong").onclick=()=>{
 const b=book($("gameBook").value);
 if(!b)return;

 const total=getWrongHistory(b.id).length;

 if(!total){
  alert(
   "저장된 오답 이력이 없습니다.\n"+
   "일반 퀴즈에서 틀린 단어가 먼저 필요합니다."
  );
  return;
 }

 if(!confirm(
  b.name+"의 오답 이력 "+total+
  "개를 다시 복습 목록에 추가할까요?"
 ))return;

 const count=restoreWrongAnswers(b.id);

 updateQuizInfo();
 renderWrongList();

 alert(
  count+"개 단어를 복습 목록에 추가했습니다."
 );

 if(quizType==="wrong"){
  startGame();
 }
};

/* 오답 이력 완전 삭제 */

$("clearWrongHistory").onclick=()=>{
 const b=book($("gameBook").value);
 if(!b)return;

 if(!confirm(
  b.name+"의 오답 목록과 오답 이력을 "+
  "모두 삭제할까요?\n"+
  "삭제 후에는 복원할 수 없습니다."
 ))return;

 wrongData[b.id]=[];
 wrongHistory[b.id]=[];

 persist();
 updateQuizInfo();
 renderWrongList();

 if(quizType==="wrong"){
  startGame();
 }

 alert("오답 이력을 삭제했습니다.");
};

/* ==========================
   페이지 및 단어장
========================== */

function showPage(name){
 for(const p of ["game","books","import"]){
  $(p+"Page").classList.toggle(
   "hidden",p!==name
  );
 }

 document.querySelectorAll(
  "[data-page]"
 ).forEach(b=>{
  b.classList.toggle(
   "active",
   b.dataset.page===name
  );
 });

 if(name==="books")renderBook();

 if(name==="game"){
  checkAllDailyResets();
  renderWrongList();
 }
}

document.querySelectorAll(
 "[data-page]"
).forEach(b=>{
 b.onclick=()=>showPage(b.dataset.page);
});

function refreshSelectors(){
 for(const id of [
  "gameBook","manageBook","importBook"
 ]){
  const select=$(id);
  const previous=select.value;

  select.replaceChildren();

  for(const b of db.books){
   const option=document.createElement("option");

   option.value=b.id;
   option.textContent=
    b.name+" ("+b.words.length+"개)";

   select.append(option);
  }

  if(book(previous)){
   select.value=previous;
  }
 }

 updateQuizInfo();
}

function makeBook(name){
 name=norm(name);

 if(!name){
  alert("단어장 이름을 입력하세요.");
  return null;
 }

 if(db.books.some(b=>b.name===name)){
  alert("같은 이름의 단어장이 있습니다.");
  return null;
 }

 const b={
  id:"book_"+Date.now()+"_"+
   Math.random().toString(36).slice(2,7),
  name,
  words:[]
 };

 db.books.push(b);

 resetDates[b.id]=todayString();

 persist();
 refreshSelectors();

 return b;
}

$("createBook").onclick=()=>{
 const b=makeBook(
  $("newBookName").value
 );

 if(!b)return;

 $("newBookName").value="";
 $("manageBook").value=b.id;

 renderBook();
};

$("importCreate").onclick=()=>{
 const b=makeBook(
  $("importNewName").value
 );

 if(!b)return;

 $("importNewName").value="";
 $("importBook").value=b.id;
};

$("renameBook").onclick=()=>{
 const b=book(
  $("manageBook").value
 );
 if(!b)return;

 let name=prompt(
  "새 단어장 이름",b.name
 );

 if(name===null)return;

 name=norm(name);

 if(
  !name ||
  db.books.some(
   x=>x.id!==b.id&&x.name===name
  )
 ){
  alert("사용할 수 없는 이름입니다.");
  return;
 }

 b.name=name;

 persist();
 refreshSelectors();
 renderBook();
};

$("deleteBook").onclick=()=>{
 const b=book(
  $("manageBook").value
 );
 if(!b)return;

 if(db.books.length===1){
  alert(
   "마지막 단어장은 삭제할 수 없습니다."
  );
  return;
 }

 if(!confirm(
  b.name+" 단어장과 모든 단어를 삭제할까요?"
 ))return;

 db.books=db.books.filter(
  x=>x.id!==b.id
 );

/* ==========================
   텍스트 자동 분리
========================== */

const ENG=
 "[A-Za-z][A-Za-z’'\\-]*"+
 "(?:\\s+[A-Za-z][A-Za-z’'\\-]*)*";

const KOR=
 "[~～]?[가-힣]"+
 "[가-힣0-9\\s,·()~～\\-]*";

function parseText(raw){
 const found=[];
 const failed=[];
 const seen=new Set();

 const lines=raw.replace(
  /\r/g,""
 ).split("\n");

 for(let line of lines){
  line=line.trim().replace(
   /^\s*(?:\d+[.)]|[•*])\s*/,""
  );

  if(!line)continue;

  const explicit=line.match(
   /^(.+?)\s*[|\t]\s*(.+?)(?:\s*[|\t]\s*(n|v|a|ad))?\s*$/i
  );

  if(explicit){
   const w={
    en:norm(explicit[1]),
    ko:norm(explicit[2]),
    pos:(explicit[3]||"").toLowerCase()
   };

   if(
    valid(w)&&
    !seen.has(key(w.en))
   ){
    found.push(w);
    seen.add(key(w.en));
   }else{
    failed.push(line);
   }

   continue;
  }

  const re=new RegExp(
   "("+ENG+")\\s+("+KOR+")"+
   "(?=\\s+(?:"+ENG+")\\s+[~～가-힣]|$)",
   "g"
  );

  const matches=[
   ...line.matchAll(re)
  ];

  if(!matches.length){
   failed.push(line);
   continue;
  }

  for(const m of matches){
   const w={
    en:norm(m[1]),
    ko:norm(m[2]),
    pos:""
   };

   if(
    valid(w)&&
    !seen.has(key(w.en))
   ){
    found.push(w);
    seen.add(key(w.en));
   }
  }
 }

 return {found,failed};
}

function textField(label,value,callback){
 const box=document.createElement("label");
 box.textContent=label;

 const input=document.createElement("input");
 input.value=value;

 input.oninput=()=>{
  callback(input.value);
 };

 box.append(input);
 return box;
}

function posField(value,callback){
 const select=document.createElement("select");

 for(const [v,t] of [
  ["","미확인 / 숙어"],
  ["n","n 명사"],
  ["v","v 동사"],
  ["a","a 형용사"],
  ["ad","ad 부사"]
 ]){
  const option=document.createElement("option");

  option.value=v;
  option.textContent=t;

  select.append(option);
 }

 select.value=value||"";

 select.onchange=()=>{
  callback(select.value);
 };

 return select;
}

/* ==========================
   철자 판정
========================== */

function spellingDistance(a,b){
 a=key(a);
 b=key(b);

 const dp=Array.from(
  {length:a.length+1},
  ()=>Array(b.length+1).fill(0)
 );

 for(let i=0;i<=a.length;i++){
  dp[i][0]=i;
 }

 for(let j=0;j<=b.length;j++){
  dp[0][j]=j;
 }

 for(let i=1;i<=a.length;i++){
  for(let j=1;j<=b.length;j++){
   dp[i][j]=Math.min(
    dp[i-1][j]+1,
    dp[i][j-1]+1,
    dp[i-1][j-1]+
    (a[i-1]===b[j-1]?0:1)
   );
  }
 }

 return dp[a.length][b.length];
}

function getResultClass(r){
 if(r.status==="correct"){
  return "result-correct";
 }

 if(r.status==="skip"){
  return "result-wrong";
 }

 if(
  r.mode==="meaning" &&
  spellingDistance(
   r.answer,r.word.en
  )===1
 ){
  return "result-almost";
 }

 return "result-wrong";
}

function getResultLabel(r){
 if(r.status==="correct")return "정답";
 if(r.status==="skip")return "건너뜀";

 if(getResultClass(r)==="result-almost"){
  return "철자 한 글자 차이";
 }

 return "오답";
}

function startGame(){

 const b=book(
  $("gameBook").value
 );
 if(!b)return;

 activeBookId=b.id;
 activeQuizType=quizType;
 activeMode=mode;

 cleanRecords(b.id);

 if(quizType==="wrong"){
  const wrongKeys=new Set(
   getWrongSet(b.id).map(key)
  );

  deck=shuffled(
   b.words.filter(
    w=>wrongKeys.has(key(w.en))
   )
  ).slice(0,20).map(w=>({...w}));

 }else{
  const masteredKeys=new Set(
   getMasteredSet(b.id).map(key)
  );

  const notMastered=shuffled(
   b.words.filter(
    w=>!masteredKeys.has(key(w.en))
   )
  );

  const mastered=shuffled(
   b.words.filter(
    w=>masteredKeys.has(key(w.en))
   )
  );

  deck=[
   ...notMastered,
   ...mastered
  ].slice(0,20).map(w=>({...w}));
 }

 qi=0;
 score=0;
 streak=0;
 history=[];
 answered=false;

 $("results").classList.add("hidden");

 $("play").classList.toggle(
  "hidden",!deck.length
 );

 $("gameMessage").classList.toggle(
  "hidden",!!deck.length
 );

 if(!deck.length){
  $("gameMessage").textContent=
   quizType==="wrong"
   ?"현재 복습할 오답이 없습니다.\n"+
    "오답 이력이 있다면 "+
    "'오답 다시 풀기'를 눌러 주세요."
   :"단어장이 비어 있습니다. "+
    "먼저 단어를 추가하세요.";

  updateStats();
  updateQuizInfo();
  renderWrongList();
  return;
 }

 renderQuestion();
 updateQuizInfo();
 renderWrongList();
}

   )continue;

   if(choices.length===4)break;
  }

  for(const x of shuffled(choices)){
   const button=document.createElement("button");

   button.className="option";
   button.textContent=x.ko;

   button.onclick=()=>finish(
    key(x.en)===key(w.en),
    x.en,
    false
   );

   options.append(button);
  }
 }

 updateStats();
}

function finish(correct,answer,skipped){
 if(answered)return;

 answered=true;

 const w=deck[qi];

 const status=skipped
  ?"skip"
  :correct
   ?"correct"
   :"wrong";

 const b=book(activeBookId);

 const selected=b?.words.find(
  x=>key(x.en)===key(answer)
 );

 history.push({
  word:{...w},
  answer,
  selectedMeaning:
   activeMode==="english"
   ?(selected?.ko||"")
   :"",
  status,
  mode:activeMode
 });

 if(correct&&!skipped){
  score+=10;
  streak++;

  markMastered(activeBookId,w.en);

  if(activeQuizType==="wrong"){
   removeWrong(activeBookId,w.en);
  }

 }else{
  streak=0;
  addWrong(activeBookId,w.en);
 }

 $("answer").disabled=true;
 $("check").disabled=true;

 const feedback=$("feedback");

 feedback.className=
  "note "+(correct?"ok":"bad");

 const lines=[
  skipped
  ?"건너뛴 문제입니다."
  :correct
   ?"정답! +10점"
   :"오답입니다."
 ];

 if(!correct){
  const shown=skipped
   ?"건너뜀"
   :activeMode==="english"
    ?(selected?.ko||answer)
    :answer;

  lines.push("내 답: "+shown);

  if(
   selected &&
   activeMode==="meaning"
  ){
   lines.push(
    "내 답의 뜻: "+selected.ko
   );
  }
 }

 lines.push(
  "정답: "+w.en,
  "뜻: "+w.ko,
  "품사: "+posLabel(w.pos)
 );

 feedback.textContent=lines.join("\n");

 if(activeMode==="english"){
  [...$("options").children].forEach(button=>{
   button.disabled=true;

   if(button.textContent===w.ko){
    button.classList.add("correct");
   }else if(
    !correct &&
    !skipped &&
    button.textContent===selected?.ko
   ){
    button.classList.add("wrong");
   }
  });
 }

 $("skip").classList.add("hidden");
 $("next").classList.remove("hidden");

 $("next").textContent=
  qi===deck.length-1
  ?"결과 확인"
  :"다음 문제";

 updateStats();
 updateQuizInfo();
 renderWrongList();
}

    card.append(tip);
   }
  }

  list.append(card);
 });

 if(
  activeQuizType==="wrong" &&
  remaining===0
 ){
  const complete=document.createElement("div");

  complete.className="note ok";

  complete.textContent=
   "오답 복습 완료!\n"+
   "현재 복습할 오답이 없습니다.\n"+
   "내일 다시 접속하면 이전 오답을 "+
   "다시 복습할 수 있습니다.";

  list.prepend(complete);
 }

 updateStats();
 renderWrongList();
}

/* ==========================
   퀴즈 모드 변경
========================== */

function setQuizType(type){
 quizType=type;

 $("normalQuiz").className=
  type==="normal"
  ?"primary grow"
  :"secondary grow";

 $("wrongQuiz").className=
  type==="wrong"
  ?"primary grow"
  :"secondary grow";

 startGame();
}

$("normalQuiz").onclick=()=>{
 setQuizType("normal");
};

$("wrongQuiz").onclick=()=>{
 setQuizType("wrong");
};

$("modeMeaning").onclick=()=>{
 mode="meaning";

 $("modeMeaning").className="primary grow";
 $("modeEnglish").className="secondary grow";

 startGame();
};

$("modeEnglish").onclick=()=>{
 mode="english";

 $("modeEnglish").className="primary grow";
 $("modeMeaning").className="secondary grow";

 startGame();
};

$("gameBook").onchange=startGame;
$("startGame").onclick=startGame;
$("retry").onclick=startGame;

/* ==========================
   초기 실행
========================== */

migrateWrongHistory();
checkAllDailyResets();
refreshSelectors();
persist();
startGame();

/* 사이트로 다시 돌아왔을 때
   날짜 변경 확인 */

document.addEventListener(
 "visibilitychange",
 ()=>{
  if(!document.hidden){
   checkAllDailyResets();
   updateQuizInfo();
   renderWrongList();
  }
 }
);

window.addEventListener(
 "focus",
 ()=>{
  checkAllDailyResets();
 }
);

</script>
</body>
</html>
